name: Warm production pages

# ISR serves the last render until a request arrives, so after an idle spell the first
# visitor saw days-old data. Two requests an hour apart keep every page within about an
# hour: the first returns the stale render and triggers regeneration, the second confirms it.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          for path in / /flows /issuance /summary /api/metrics; do
            curl -fsS -o /dev/null --max-time 120 "https://ondo-nexus.vercel.app${path}"
            sleep 5
            curl -fsS -o /dev/null -w "${path} %{http_code}\n" --max-time 120 "https://ondo-nexus.vercel.app${path}"
          done
